[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clearledger-zongce"
version = "1.0.0rc4"
description = "北京师范大学学生综合测评管理系统：证据唯一、局部标注、确定性计算"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "SQLAlchemy==2.0.50",
  "pydantic==2.13.4", "python-multipart==0.0.29", "argon2-cffi==25.1.0",
  "Pillow==12.3.0", "reportlab==4.4.9", "defusedxml==0.7.1",
  "psycopg[binary]==3.2.13", "pillow-heif==1.3.0"
]
[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1", "playwright==1.57.0", "pytest-cov==7.0.0", "PyMuPDF==1.26.7"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["static/*", "templates/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
